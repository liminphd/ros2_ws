ekf_global_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Wheel odometry: only forward velocity.
    odom0: /wheel/odometry
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  false, false,
       false, false, false,
       false, false, false]
    odom0_differential: false
    odom0_relative: false

    # SBG IMU: orientation and angular velocity.
    imu0: /imu/data
    imu0_config:
      [false, false, false,
       true,  true,  true,
       false, false, false,
       true,  true,  true,
       false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # GNSS position produced by navsat_transform_node.
    odom1: /odometry/gps
    odom1_config:
      [true,  true,  false,
       false, false, false,
       false, false, false,
       false, false, false,
       false, false, false]
    odom1_differential: false
    odom1_relative: false
