amcl:
  ros__parameters:
    use_sim_time: false

    # Frames must match the existing AMIGA localization/Nav2 stack.
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

    # VLP16-derived 2D scan used by SLAM Toolbox and Nav2.
    scan_topic: /scan_multi
    map_topic: map

    tf_broadcast: true
    transform_tolerance: 1.0

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_min_range: -1.0
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    do_beamskip: false

    update_min_d: 0.10
    update_min_a: 0.20

    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    save_pose_rate: 0.5
