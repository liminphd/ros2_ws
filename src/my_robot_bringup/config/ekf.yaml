ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    # Explicit fixed process-noise baseline.
    # State order:
    # [x, y, z, roll, pitch, yaw,
    #  vx, vy, vz, vroll, vpitch, vyaw,
    #  ax, ay, az]
    #
    # All values retain robot_localization defaults except:
    # yaw:  0.06 -> 1.0e-4
    # vyaw: 0.02 -> 1.0e-5
    process_noise_covariance:
      [1.0e-4, 1.0e-4, 0.06,
       0.03, 0.03, 1.0e-4,
       0.025, 0.025, 0.04,
       0.01, 0.01, 1.0e-5,
       0.01, 0.01, 0.015]

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data_cov

    # SBG IMU: use only yaw angular velocity for local odometry.
    # Absolute yaw is intentionally not fused here.
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    odom0: /wheel/odometry

    # Wheel odometry:
    # vx from wheel kinematics;
    # vy = 0 used as nonholonomic lateral-velocity constraint.
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  true,  false,
       false, false, false,
       false, false, false]

    odom0_differential: false
    odom0_relative: false
